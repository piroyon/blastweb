[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blastweb"
version = "0.2.0"
description = "A simple web interface and REST API for local BLAST+ databases, inspired by NCBI's legacy wwwblast."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["blast", "blast+", "ncbi-blast", "wwwblast", "bioinformatics", "sequence alignment", "flask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
authors = [
  {name = "Hiroyo NISHIDE", email = "hiroyo@nibb.ac.jp"}
]
dependencies = [
  "Flask",
  "click",
  "PyYAML"
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
blastweb = "blastweb.cli:cli"


[project.urls]
Homepage = "https://github.com/piroyon/blastweb"

[tool.setuptools]
packages = ["blastweb"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
