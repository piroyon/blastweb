[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blastweb"
version = "0.2.0"
description = "A simple web UI and API for running BLAST+ against local databases."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Hiroyo NISHIDE", email = "hiroyo@nibb.ac.jp"}
]
dependencies = [
  "Flask",
  "click",
  "PyYAML"
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
blastweb = "blastweb.cli:cli"


[project.urls]
Homepage = "https://github.com/piroyon/blastweb"

[tool.setuptools]
packages = ["blastweb"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
