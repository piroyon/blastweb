<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BLAST+{% endblock %}</title>
  {% block head %}{% endblock %}
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
      padding: 2em;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #1d4ed8;
    }
    h1 a {
      color: inherit;
      text-decoration: none;
    }
    a {
      color: #2563eb;
    }
    .panel {
      max-width: 700px;
      margin: 0 auto 1.5em;
      background: #ffffff;
      padding: 2em;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .panel.wide {
      max-width: 95%;
      padding: 1.5em;
      overflow-x: auto;
    }
    .button {
      display: inline-block;
      padding: 0.7em 1.5em;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 1em;
    }
    .button:hover {
      background: #2563eb;
    }
    .button.secondary {
      background: #9ea1a3;
    }
    .button.secondary:hover {
      background: #c0c6c9;
    }
    .error {
      color: #b91c1c;
      text-align: center;
      margin-bottom: 1em;
      white-space: pre-wrap;
    }
    .muted {
      color: #6b7280;
      font-size: 0.9em;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 2em;
      font-weight: bold;
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <h1><a href="{{ url_for('index') }}">BLAST+</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
